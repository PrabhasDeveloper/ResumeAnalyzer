<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Analyzer | Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js?v=20260427-1" defer></script>
  </head>
  <body class="auth-body">
    <main class="auth-layout">
      <section class="brand-panel card elevated">
        <p class="eyebrow">AI Resume Analyzer</p>
        <h1>Turn your resume into interview-ready momentum.</h1>
        <p>
          Upload your PDF, define your target role, and let AI evaluate alignment against real job descriptions.
        </p>
        <div class="brand-pills">
          <span>Backend-driven scoring</span>
          <span>Actionable skill gaps</span>
          <span>Rewrite-ready bullets</span>
        </div>
      </section>

      <section class="auth-panel card" id="auth-page">
        <div class="tab-row">
          <button class="tab-btn active" data-tab="login">Login</button>
          <button class="tab-btn" data-tab="register">Register</button>
        </div>

        <p class="error-banner" id="auth-error" aria-live="polite"></p>
        <p class="success-banner" id="auth-success" aria-live="polite"></p>

        <form id="login-form" class="auth-form">
          <h2>Welcome back</h2>
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" required />

          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required />

          <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
        </form>

        <form id="register-form" class="auth-form hidden">
          <h2>Create account</h2>
          <label for="register-email">Email</label>
          <input type="email" id="register-email" name="email" required />

          <label for="register-password">Password</label>
          <input type="password" id="register-password" name="password" minlength="6" required />

          <button type="submit" class="btn btn-primary" id="register-btn">Register</button>
        </form>
      </section>
    </main>
  </body>
</html>
